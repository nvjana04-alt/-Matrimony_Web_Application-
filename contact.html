    <div class="container mt-5">
      <h2>Registration Form</h2>
      <form id="registrationForm">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>

      <hr class="my-5">

      <h2>Compatibility Quiz</h2>
      <form id="quizForm">
        <div class="mb-3">
          <label class="form-label">Do you enjoy outdoor activities?</label>
          <select class="form-select" id="q1">
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Do you prefer reading or watching movies?</label>
          <select class="form-select" id="q2">
            <option value="1">Reading</option>
            <option value="0">Movies</option>
          </select>
        </div>
        <button type="button" class="btn btn-success" onclick="calculateQuiz()">Check Compatibility</button>
      </form>
      <p id="quizResult" class="mt-3"></p>
    </div>
